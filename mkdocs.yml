site_name: Zygarde Framework
site_description: A multi-module Kotlin framework for simplifying enterprise application development
site_author: Puni
site_url: https://zygarde-projects.github.io/zygarde/
repo_url: https://github.com/zygarde-projects/zygarde
repo_name: zygarde
edit_uri: edit/v2/docs/

# Copyright
copyright: Copyright &copy; 2024 Zygarde Framework

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.instant      # Instant loading
    - navigation.tracking     # Anchor tracking
    - navigation.tabs         # Top-level tabs
    - navigation.sections     # Expand sections
    - navigation.indexes      # Section index pages
    - navigation.top          # Back to top button
    - search.suggest          # Search suggestions
    - search.highlight        # Highlight search results
    - search.share            # Share search results
    - content.code.copy       # Copy code button
    - content.code.annotate   # Code annotations
  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Quick Start: getting-started/quick-start.md
    - Project Setup: getting-started/project-setup.md
    - Comparison with Alternatives: getting-started/comparison.md
  - Core Concepts:
    - Architecture: guide/architecture.md
    - Code Generation: guide/code-generation.md
    - Modules Overview: reference/modules.md
  - Features:
    - JPA Extensions: guide/jpa-extensions.md
    - Search DSL: guide/search-dsl.md
    - Model Mapping: guide/model-mapping.md
    - Web & REST APIs: guide/web-rest.md
    - SQL API DSL: guide/sql-api.md
  - Practical Examples:
    - Basic CRUD: examples/basic-crud.md
    - Advanced Queries: examples/advanced-queries.md
    - Working with Relationships: examples/relationships.md
  - Tutorials:
    - KAPT-Based Tutorial: tutorials/kapt-based.md
    - DSL-Based Tutorial: tutorials/dsl-based.md
  - Best Practices: guide/best-practices.md
  - Configuration:
    - KAPT Options: reference/kapt-options.md
    - DSL Properties: reference/dsl-properties.md
    - Common Patterns: reference/common-patterns.md
  - FAQ: faq.md
  - Changelog: changelog.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zygarde-projects/zygarde
  version:
    provider: mike
    default: latest

# CSS customization (optional)
extra_css:
  - stylesheets/extra.css

# JavaScript customization (optional)
extra_javascript:
  - javascripts/extra.js
