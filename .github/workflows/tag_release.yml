name: release

on:
  push:
    tags:
      - '*'
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'
      - name: Build, sign, and create bundle
        run: |
          ./gradlew clean \
            publishAllPublicationsToLocalStagingRepository \
            zipStagingRepository \
            -Pversion="${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
      - name: Upload to Maven Central
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
            -H "Authorization: Bearer $MAVEN_CENTRAL_TOKEN" \
            -F "bundle=@build/distributions/bundle.zip")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" -eq 201 ]; then
            echo "Upload successful! Deployment ID: $BODY"
          else
            echo "Upload failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
        env:
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
