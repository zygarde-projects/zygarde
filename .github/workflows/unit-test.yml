name: unit test

on:
  push:
    branches:
      - master
      - v2
      - v4
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: 24
          distribution: 'zulu'
          cache: 'gradle'
      - name: run test
        run: |
          ./gradlew ktlintCheck
          ./gradlew test
        env:
          CI: true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 7
