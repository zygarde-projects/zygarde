name: Deploy Documentation

on:
  push:
    branches:
      - v2
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git info

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate API documentation with Dokka
        id: dokka
        continue-on-error: true
        run: ./gradlew dokkaHtmlMultiModule --no-daemon

      - name: Copy Dokka output to docs (if successful)
        if: steps.dokka.outcome == 'success'
        run: |
          mkdir -p docs/api
          cp -r build/dokka/htmlMultiModule/* docs/api/
          echo "✅ Dokka API documentation copied to docs/api/"

      - name: Handle Dokka failure
        if: steps.dokka.outcome == 'failure'
        run: |
          echo "⚠️  Dokka generation failed - using placeholder"
          echo "API docs placeholder will be used instead"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy documentation to GitHub Pages
        run: mkdocs gh-deploy --force

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
          retention-days: 7
